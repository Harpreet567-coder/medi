<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="medGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="crossGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <path d="M256 32 C370 32, 448 64, 448 160 C448 320, 340 440, 256 480 C172 440, 64 320, 64 160 C64 64, 142 32, 256 32 Z" 
        fill="url(#medGlow)" filter="url(#shadow)" />

  <!-- Inner Soft Accent Shield -->
  <path d="M256 56 C350 56, 420 84, 420 168 C420 304, 324 412, 256 448 C188 412, 92 304, 92 168 C92 84, 162 56, 256 56 Z" 
        fill="#ffffff" opacity="0.12" />

  <!-- Central Medical Cross -->
  <rect x="220" y="140" width="72" height="200" rx="20" fill="url(#crossGlow)" />
  <rect x="156" y="204" width="200" height="72" rx="20" fill="url(#crossGlow)" />

  <!-- Vital Pulse Line overlay across cross -->
  <path d="M140 240 L210 240 L230 190 L256 290 L280 220 L298 250 L310 240 L370 240" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Heart Pulse Center Dot -->
  <circle cx="256" cy="240" r="8" fill="#38bdf8" />
</svg>